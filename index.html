<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年药师技能大赛题库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f4f8;min-height:100vh;color:#333;}
.container{max-width:700px;margin:0 auto;padding:16px;}

/* Start Screen */
.start-screen{text-align:center;padding-top:60px;}
.start-screen h1{font-size:26px;color:#1a73e8;margin-bottom:8px;}
.start-screen .subtitle{color:#666;margin-bottom:12px;font-size:14px;}
.start-screen .stats{display:flex;justify-content:center;gap:20px;margin:20px 0;flex-wrap:wrap;}
.start-screen .stat{background:#fff;border-radius:12px;padding:16px 20px;box-shadow:0 1px 4px rgba(0,0,0,0.08);min-width:80px;}
.start-screen .stat .num{font-size:28px;font-weight:bold;color:#1a73e8;}
.start-screen .stat .lbl{font-size:12px;color:#999;margin-top:4px;}
.btn{display:inline-block;padding:14px 48px;border:none;border-radius:30px;font-size:17px;cursor:pointer;font-weight:600;transition:all .2s;text-decoration:none;}
.btn-primary{background:#1a73e8;color:#fff;box-shadow:0 2px 8px rgba(26,115,232,0.3);}
.btn-primary:hover{background:#1557b0;transform:translateY(-1px);}
.btn-primary:active{transform:translateY(0);}
.btn-secondary{background:#fff;color:#1a73e8;border:2px solid #1a73e8;margin-left:12px;}
.btn-small{padding:8px 24px;font-size:14px;border-radius:20px;}

/* Quiz Screen */
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.progress-bar{flex:1;min-width:150px;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-right:12px;}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,#1a73e8,#4fc3f7);border-radius:4px;transition:width .3s;}
.progress-text{font-size:13px;color:#666;white-space:nowrap;}
.score-display{font-size:13px;color:#1a73e8;font-weight:600;white-space:nowrap;}
.type-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;color:#fff;}
.type-tf{background:#ff9800;}
.type-single{background:#4caf50;}
.type-multi{background:#9c27b0;}
.type-fill{background:#00bcd4;}

.question-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06);margin-bottom:16px;}
.question-num{font-size:13px;color:#999;margin-bottom:8px;}
.question-stem{font-size:17px;line-height:1.7;margin-bottom:20px;font-weight:500;}

/* Options */
.options{margin-bottom:16px;}
.option{display:flex;align-items:flex-start;padding:12px 16px;margin-bottom:8px;border:2px solid #e8eaed;border-radius:12px;cursor:pointer;transition:all .2s;font-size:15px;}
.option:hover{border-color:#1a73e8;background:#f8fbff;}
.option.selected{border-color:#1a73e8;background:#e8f0fe;}
.option.correct{border-color:#4caf50;background:#e8f5e9;}
.option.wrong{border-color:#f44336;background:#ffebee;}
.option .letter{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:#e8eaed;text-align:center;line-height:30px;font-weight:600;margin-right:12px;font-size:14px;transition:all .2s;}
.option.selected .letter{background:#1a73e8;color:#fff;}
.option.correct .letter{background:#4caf50;color:#fff;}
.option.wrong .letter{background:#f44336;color:#fff;}
.option .opt-text{flex:1;padding-top:4px;}

/* TF buttons */
.tf-options{display:flex;gap:12px;}
.tf-btn{flex:1;padding:14px;border:2px solid #e8eaed;border-radius:12px;text-align:center;cursor:pointer;font-size:16px;font-weight:600;transition:all .2s;}
.tf-btn:hover{border-color:#1a73e8;}
.tf-btn.selected{border-color:#1a73e8;background:#e8f0fe;color:#1a73e8;}
.tf-btn.correct{border-color:#4caf50;background:#e8f5e9;color:#4caf50;}
.tf-btn.wrong{border-color:#f44336;background:#ffebee;color:#f44336;}

/* Fill in blanks */
.fill-inputs{margin-bottom:16px;}
.fill-input{display:block;width:100%;padding:12px 16px;border:2px solid #c0c4cc;border-radius:10px;font-size:15px;margin-bottom:10px;transition:all .2s;outline:none;background:#fafbfc;}
.fill-input::placeholder{color:#999;}
.fill-input:focus{border-color:#1a73e8;}
.fill-input.correct{border-color:#4caf50;background:#e8f5e9;}
.fill-input.wrong{border-color:#f44336;background:#ffebee;}

/* Feedback */
.feedback{display:none;padding:14px 18px;border-radius:10px;margin-top:12px;font-size:14px;line-height:1.6;}
.feedback.show{display:block;}
.feedback.correct{background:#e8f5e9;color:#2e7d32;}
.feedback.wrong{background:#ffebee;color:#c62828;}

/* Bottom nav */
.bottom-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;}

/* Result Screen */
.result-screen{text-align:center;padding-top:40px;}
.result-screen h2{font-size:28px;margin-bottom:8px;}
.result-score{font-size:72px;font-weight:bold;color:#1a73e8;margin:20px 0;}
.result-detail{color:#666;margin-bottom:24px;font-size:14px;line-height:1.8;}
.result-screen .btn{margin:6px;}

.hidden{display:none !important;}

/* Responsive */
@media(max-width:480px){
  .container{padding:10px;}
  .start-screen{padding-top:30px;}
  .start-screen h1{font-size:22px;}
  .question-card{padding:16px;}
  .question-stem{font-size:15px;}
  .tf-btn{font-size:14px;padding:12px;}
  .result-score{font-size:56px;}
}

/* Filter bar */
.filter-bar{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap;justify-content:center;}
.filter-chip{padding:6px 14px;border:2px solid #ddd;border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s;background:#fff;white-space:nowrap;}
.filter-chip:hover,.filter-chip.active{border-color:#1a73e8;color:#1a73e8;background:#e8f0fe;}
</style>
</head>

var typeNames = { tf:'判断题', single:'单选题', multi:'多选题', fill:'多项填空题' };
var typeLabels = { tf:'判断', single:'单选', multi:'多选', fill:'填空' };
var typeColors = { tf:'type-tf', single:'type-single', multi:'type-multi', fill:'type-fill' };
var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

var state = {
  screen: 'start',
  questions: [],
  currentIndex: 0,
  answers: {},
  confirmed: {},
  filter: 'all',
  mode: 'random50' // 'random50' | 'random100' | 'all'
};

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function startQuiz(mode) {
  state.mode = mode || state.mode;
  var pool = ALL_QUESTIONS;
  if (state.filter !== 'all') {
    pool = ALL_QUESTIONS.filter(function(q) { return q.type === state.filter; });
  }
  if (state.mode === 'all') {
    state.questions = pool.slice(); // keep original order
  } else {
    var count = state.mode === 'random100' ? 100 : 50;
    state.questions = shuffle(pool).slice(0, Math.min(count, pool.length));
  }
  state.currentIndex = 0;
  state.answers = {};
  state.confirmed = {};
  state.screen = 'quiz';
  render();
  window.scrollTo(0, 0);
}

function getCurrentAnswer() {
  return state.answers[state.currentIndex];
}

function setAnswer(val) {
  state.answers[state.currentIndex] = val;
}

function checkCorrect(q, ans) {
  if (ans === undefined || ans === null) return null;
  if (q.type === 'tf') return ans === q.answer;
  if (q.type === 'single') return ans === q.answer;
  if (q.type === 'multi') {
    if (!Array.isArray(ans)) return false;
    var correct = q.answer.slice().sort().join(',');
    var user = ans.slice().sort().join(',');
    return correct === user;
  }
  if (q.type === 'fill') {
    if (!Array.isArray(ans)) return false;
    for (var i = 0; i < q.answer.length; i++) {
      var acceptable = q.answer[i].map(function(a) { return a.toString().trim().toLowerCase(); });
      var userVal = (ans[i] || '').trim().toLowerCase();
      if (acceptable.indexOf(userVal) === -1) return false;
    }
    return true;
  }
  return false;
}

function isCorrect() {
  return checkCorrect(state.questions[state.currentIndex], getCurrentAnswer());
}

function countScore() {
  var correct = 0, wrong = 0, unanswered = 0;
  state.questions.forEach(function(q, i) {
    var ans = state.answers[i];
    if (ans === undefined || ans === null) { unanswered++; return; }
    if (checkCorrect(q, ans)) correct++; else wrong++;
  });
  return { correct: correct, wrong: wrong, unanswered: unanswered, total: state.questions.length };
}

function goNext() {
  if (state.currentIndex < state.questions.length - 1) {
    state.currentIndex++;
    render();
    window.scrollTo(0, 0);
  }
}

function goPrev() {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    render();
    window.scrollTo(0, 0);
  }
}

function finishQuiz() {
  state.screen = 'result';
  render();
  window.scrollTo(0, 0);
}

function filterClick(type) {
  state.filter = type;
  render();
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getCorrectAnswerText(q) {
  if (q.type === 'tf') return q.answer === 'T' ? '正确' : '错误';
  if (q.type === 'single') return letters[q.answer] + '. ' + q.options[q.answer];
  if (q.type === 'multi') return q.answer.map(function(i) { return letters[i] + '. ' + q.options[i]; }).join('，');
  if (q.type === 'fill') return q.answer.map(function(a, i) { return '填空'+(i+1)+': ' + a.join(' 或 '); }).join('；');
  return '';
}

// ---- Render ----
function render() {
  if (state.screen === 'start') renderStart();
  else if (state.screen === 'quiz') renderQuiz();
  else if (state.screen === 'result') renderResult();
}

function renderStart() {
  var total = ALL_QUESTIONS.length;
  var tf = ALL_QUESTIONS.filter(function(q) { return q.type === 'tf'; }).length;
  var single = ALL_QUESTIONS.filter(function(q) { return q.type === 'single'; }).length;
  var multi = ALL_QUESTIONS.filter(function(q) { return q.type === 'multi'; }).length;
  var fill = ALL_QUESTIONS.filter(function(q) { return q.type === 'fill'; }).length;

  var filters = ['all','tf','single','multi','fill'];
  var filterHtml = filters.map(function(t) {
    var label = t === 'all' ? '全部' : typeLabels[t];
    var cnt = t === 'all' ? total : ALL_QUESTIONS.filter(function(q) { return q.type === t; }).length;
    var active = state.filter === t ? ' active' : '';
    return '<span class="filter-chip' + active + '" data-type="' + t + '">' + label + ' (' + cnt + ')</span>';
  }).join('');

  var count = state.filter === 'all' ? total : ALL_QUESTIONS.filter(function(q) { return q.type === state.filter; }).length;

  var h = '';
  h += '<div class="start-screen">';
  h += '<h1>2026年药师技能大赛题库</h1>';
  h += '<p class="subtitle">小李同学请注意！答题模式开启，也要记得保持开心buff哦~   -小洋同学</p>';
  h += '<div class="stats">';
  h += '<div class="stat"><div class="num">' + total + '</div><div class="lbl">总题数</div></div>';
  h += '<div class="stat"><div class="num">' + tf + '</div><div class="lbl">判断题</div></div>';
  h += '<div class="stat"><div class="num">' + single + '</div><div class="lbl">单选题</div></div>';
  h += '<div class="stat"><div class="num">' + multi + '</div><div class="lbl">多选题</div></div>';
  h += '<div class="stat"><div class="num">' + fill + '</div><div class="lbl">填空题</div></div>';
  h += '</div>';
  h += '<div class="filter-bar" id="filterBar">' + filterHtml + '</div>';
  h += '<p style="font-size:14px;color:#666;margin:16px 0 8px;">当前题库共 <b>' + count + '</b> 题，请选择题量：</p>';
  h += '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">';
  h += '<button class="btn btn-primary" id="btn50">随机50题</button>';
  h += '<button class="btn btn-primary" id="btn100">随机100题</button>';
  h += '<button class="btn btn-secondary" id="btnAll">按顺序答全部</button>';
  h += '</div>';
  h += '</div>';
  document.getElementById('app').innerHTML = h;

  // Attach event listeners
  document.getElementById('btn50').addEventListener('click', function() { startQuiz('random50'); });
  document.getElementById('btn100').addEventListener('click', function() { startQuiz('random100'); });
  document.getElementById('btnAll').addEventListener('click', function() { startQuiz('all'); });
  var chips = document.getElementById('filterBar').querySelectorAll('.filter-chip');
  chips.forEach(function(chip) {
    chip.addEventListener('click', function() {
      filterClick(this.getAttribute('data-type'));
    });
  });
}

function renderQuiz() {
  var q = state.questions[state.currentIndex];
  var idx = state.currentIndex;
  var total = state.questions.length;
  var progress = Math.round((idx + 1) / total * 100);
  var userAns = getCurrentAnswer();
  // For tf/single: check immediately. For multi/fill: only check after confirm.
  var result = null;
  if (userAns !== undefined && userAns !== null) {
    if (q.type === 'tf' || q.type === 'single') {
      result = isCorrect();
    } else if (state.confirmed[idx]) {
      result = isCorrect();
    }
  }

  // Count score
  var answered = 0, correctCount = 0;
  Object.keys(state.answers).forEach(function(k) {
    var i = parseInt(k);
    var ans = state.answers[i];
    if (ans !== undefined && ans !== null) {
      answered++;
      if (checkCorrect(state.questions[i], ans)) correctCount++;
    }
  });

  var contentHtml = '';
  contentHtml += '<div class="question-num">第 ' + (idx+1) + '/' + total + ' 题  |  <span class="' + typeColors[q.type] + ' type-badge">' + typeNames[q.type] + '</span></div>';
  contentHtml += '<div class="question-stem">' + escapeHtml(q.stem) + '</div>';

  // Answer area
  if (q.type === 'tf') {
    contentHtml += '<div class="tf-options">';
    contentHtml += buildTfBtn('T', '正确', userAns, result, q);
    contentHtml += buildTfBtn('F', '错误', userAns, result, q);
    contentHtml += '</div>';
  } else if (q.type === 'single') {
    contentHtml += '<div class="options">';
    q.options.forEach(function(opt, i) {
      contentHtml += buildOption(i, opt, userAns, result, q, 'single');
    });
    contentHtml += '</div>';
  } else if (q.type === 'multi') {
    if (result === null) {
      contentHtml += '<div style="font-size:13px;color:#e67e22;margin-bottom:10px;">可多选，选好所有正确选项后点下方「确认答案」</div>';
    }
    contentHtml += '<div class="options">';
    q.options.forEach(function(opt, i) {
      contentHtml += buildOption(i, opt, userAns, result, q, 'multi');
    });
    contentHtml += '</div>';
    if (result === null && Array.isArray(userAns) && userAns.length > 0) {
      contentHtml += '<div style="margin-top:12px;"><button class="btn btn-small btn-primary" id="btnConfirm">确认答案</button></div>';
    }
  } else if (q.type === 'fill') {
    if (result === null) {
      contentHtml += '<div style="font-size:13px;color:#e67e22;margin-bottom:10px;">在下方输入框中填写答案，完成后点「确认答案」</div>';
    }
    contentHtml += '<div class="fill-inputs">';
    for (var j = 0; j < q.answer.length; j++) {
      var val = (Array.isArray(userAns) && userAns[j]) ? userAns[j] : '';
      var inputCls = '';
      if (result !== null) {
        var acceptable = q.answer[j].map(function(a) { return a.toString().trim().toLowerCase(); });
        var userVal = (val || '').trim().toLowerCase();
        inputCls = acceptable.indexOf(userVal) !== -1 ? ' correct' : ' wrong';
      }
      var disabledAttr = result !== null ? ' disabled' : '';
      contentHtml += '<input class="fill-input' + inputCls + '" type="text" placeholder="填空 ' + (j+1) + '" value="' + escapeHtml(val) + '" data-idx="' + j + '"' + disabledAttr + '>';
    }
    contentHtml += '</div>';
    if (result === null) {
      contentHtml += '<div style="margin-top:8px;"><button class="btn btn-small btn-primary" id="btnConfirm">确认答案</button></div>';
    }
  }

  // Feedback (for tf/single, shown immediately; for multi/fill, shown after confirm)
  if (result === true) {
    contentHtml += '<div class="feedback correct show">回答正确！</div>';
  } else if (result === false) {
    contentHtml += '<div class="feedback wrong show">回答错误！正确答案：' + getCorrectAnswerText(q) + '</div>';
  }

  var h = '';
  h += '<div class="quiz-header">';
  h += '<div class="progress-bar"><div class="fill" style="width:' + progress + '%"></div></div>';
  h += '<span class="progress-text">' + progress + '%</span>';
  h += '<span class="score-display">已答 ' + answered + '/' + total + ' | 对 ' + correctCount + '</span>';
  h += '</div>';
  h += '<div class="question-card" id="questionCard">' + contentHtml + '</div>';
  h += '<div class="bottom-nav">';
  h += '<button class="btn btn-small btn-secondary" id="btnPrev" ' + (idx === 0 ? 'disabled' : '') + '>上一题</button>';
  if (idx < total - 1) {
    h += '<button class="btn btn-small btn-primary" id="btnNext">下一题</button>';
  } else {
    h += '<button class="btn btn-small btn-primary" id="btnFinish">交卷看成绩</button>';
  }
  h += '</div>';
  h += '<div style="text-align:center;margin-top:10px;"><a href="javascript:void(0)" id="btnHome" style="color:#999;font-size:13px;text-decoration:none;">返回首页</a></div>';
  document.getElementById('app').innerHTML = h;

  // Attach event listeners
  var card = document.getElementById('questionCard');

  // TF buttons
  card.querySelectorAll('.tf-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (isCorrect() !== null) return;
      setAnswer(this.getAttribute('data-val'));
      render();
    });
  });

  // Options
  card.querySelectorAll('.option').forEach(function(opt) {
    opt.addEventListener('click', function() {
      if (q.type === 'single' && isCorrect() !== null) return;
      if (q.type === 'multi' && state.confirmed[idx]) return;
      var i = parseInt(this.getAttribute('data-idx'));
      if (q.type === 'single') {
        setAnswer(i);
        render();
      } else if (q.type === 'multi') {
        var ans = getCurrentAnswer();
        if (!Array.isArray(ans)) ans = [];
        var pos = ans.indexOf(i);
        if (pos === -1) ans.push(i); else ans.splice(pos, 1);
        setAnswer(ans);
        render();
      }
    });
  });

  // Confirm button for multi/fill
  var btnConfirm = document.getElementById('btnConfirm');
  if (btnConfirm) {
    btnConfirm.addEventListener('click', function() {
      state.confirmed[idx] = true;
      render();
    });
  }

  // Fill inputs
  card.querySelectorAll('.fill-input').forEach(function(inp) {
    inp.addEventListener('input', function() {
      if (state.confirmed[idx]) return;
      var j = parseInt(this.getAttribute('data-idx'));
      var ans = getCurrentAnswer();
      if (!Array.isArray(ans)) ans = new Array(q.answer.length).fill('');
      ans[j] = this.value;
      setAnswer(ans);
    });
  });

  // Nav buttons
  var btnPrev = document.getElementById('btnPrev');
  var btnNext = document.getElementById('btnNext');
  var btnFinish = document.getElementById('btnFinish');
  var btnHome = document.getElementById('btnHome');
  if (btnPrev) btnPrev.addEventListener('click', goPrev);
  if (btnNext) btnNext.addEventListener('click', goNext);
  if (btnFinish) btnFinish.addEventListener('click', finishQuiz);
  if (btnHome) btnHome.addEventListener('click', function() {
    state.screen = 'start';
    render();
  });
}

function buildTfBtn(val, label, userAns, result, q) {
  var cls = '';
  if (userAns === val) cls += ' selected';
  if (result !== null) {
    if (val === q.answer) cls += ' correct';
    else if (userAns === val) cls += ' wrong';
  }
  return '<div class="tf-btn' + cls + '" data-val="' + val + '">' + label + '</div>';
}

function buildOption(i, opt, userAns, result, q, mode) {
  var cls = '';
  if (mode === 'single') {
    if (userAns === i) cls += ' selected';
    if (result !== null) {
      if (i === q.answer) cls += ' correct';
      else if (userAns === i) cls += ' wrong';
    }
  } else {
    if (Array.isArray(userAns) && userAns.indexOf(i) !== -1) cls += ' selected';
    if (result !== null) {
      if (q.answer.indexOf(i) !== -1) cls += ' correct';
      else if (Array.isArray(userAns) && userAns.indexOf(i) !== -1) cls += ' wrong';
    }
  }
  return '<div class="option' + cls + '" data-idx="' + i + '"><span class="letter">' + letters[i] + '</span><span class="opt-text">' + escapeHtml(opt) + '</span></div>';
}

function renderResult() {
  var score = countScore();
  var pct = score.total > 0 ? Math.round(score.correct / score.total * 100) : 0;

  var h = '';
  h += '<div class="result-screen">';
  h += '<h2>答题完成</h2>';
  h += '<div class="result-score">' + pct + '分</div>';
  h += '<div class="result-detail">';
  h += '共 <b>' + score.total + '</b> 题 | 正确 <b style="color:#4caf50">' + score.correct + '</b> 题 | 错误 <b style="color:#f44336">' + score.wrong + '</b> 题';
  if (score.unanswered > 0) {
    h += ' | 未答 <b style="color:#999">' + score.unanswered + '</b> 题';
  }
  h += '</div>';
  h += '<button class="btn btn-primary" id="btnReview">查看错题</button>';
  h += '<button class="btn btn-secondary" id="btnHome">返回首页</button>';
  h += '<br><button class="btn btn-small btn-secondary" id="btnRetry" style="margin-top:12px;">重新刷题</button>';
  h += '</div>';
  document.getElementById('app').innerHTML = h;

  document.getElementById('btnReview').addEventListener('click', reviewQuiz);
  document.getElementById('btnHome').addEventListener('click', function() {
    state.screen = 'start';
    render();
  });
  document.getElementById('btnRetry').addEventListener('click', function() {
    state.screen = 'start';
    state.filter = 'all';
    render();
  });
}

function reviewQuiz() {
  var wrong = [];
  state.questions.forEach(function(q, i) {
    var ans = state.answers[i];
    if (ans === undefined || ans === null) {
      wrong.push(q);
    } else if (!checkCorrect(q, ans)) {
      wrong.push(q);
    }
  });

  if (wrong.length === 0) {
    alert('你没有错题，恭喜！');
    return;
  }

  state.questions = wrong;
  state.currentIndex = 0;
  state.answers = {};
  state.screen = 'quiz';
  render();
}

// Init
render();
})();
</script>
</body>
</html>
